version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: souhil
      MYSQL_DATABASE: projecttasksdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psouhil"]
      timeout: 20s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password

  # .NET 10 Backend
  backend:
    build:
      context: ./BackendProjectManagement/BackendProjectManagement
      dockerfile: Dockerfile
    container_name: backend-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=projecttasksdb;User=root;Password=souhil;SslMode=None
      - Jwt__Key=a-very-long-secret-at-least-32-chars-1234567890
      - Jwt__Issuer=http://localhost:7033
      - Jwt__Audience=http://localhost:7033
      - Jwt__ExpirationDays=30
    ports:
      - "7033:7033"
    networks:
      - app-network
    volumes:
      - ./BackendProjectManagement/BackendProjectManagement:/app
      - ~/.nuget/packages:/root/.nuget/packages:ro
    # For hot reload
    command: dotnet watch run --urls "http://0.0.0.0:7033"

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:7033
      - VITE_API_URL_DOCKER=http://backend:7033
    ports:
      - "3000:3000"
    networks:
      - app-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npm run dev -- --host 0.0.0.0 --port 3000

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: